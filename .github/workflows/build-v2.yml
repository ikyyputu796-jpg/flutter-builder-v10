name: Build Flutter APK V2

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      abi:
        description: "ABI: arm64 (tercepat & kecil) / all (semua ABI)"
        required: false
        default: "arm64"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_ENVIRONMENT: ci
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

    steps:
      # Tidak perlu setup-node & checkout: build hanya memakai ZIP dari bot.

      - name: Download & Extract ZIP
        run: |
          curl -fL --retry 4 --retry-all-errors --retry-delay 1 --connect-timeout 10 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -tq project.zip || { echo "❌ File bukan ZIP valid"; exit 1; }
          unzip -q project.zip -d project_raw
          rm -rf project_raw/__MACOSX
          find project_raw -maxdepth 1 -type f -name ".*" -delete
          SUB=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILES=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          # Versi Flutter
          VER="stable"
          if [ -f "$PROJECT_DIR/pubspec.yaml" ]; then
            V=$(grep -E "^\s*flutter:\s*[\"']?[0-9]" "$PROJECT_DIR/pubspec.yaml" | head -1 | awk '{print $2}' | tr -d "\"'")
            [ -n "$V" ] && VER="$V"
          fi
          echo "FLUTTER_VERSION=$VER" >> $GITHUB_ENV

      # Cache dipasang SETELAH ZIP diekstrak supaya key-nya benar-benar mengikuti project
      - name: Cache Gradle & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-build-${{ hashFiles(format('{0}/pubspec.yaml', env.PROJECT_DIR), format('{0}/android/**/*.gradle*', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          flutter pub get > /dev/null 2>&1
          flutter analyze > analyze_report.txt 2>&1
          CODE=$?
          echo "[RESULT_ANALYZE]"
          cat analyze_report.txt
          echo "[END_RESULT_ANALYZE]"
          exit $CODE

      - name: Auto-Fix & Prepare Android Project
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          [ -f "pubspec.yaml" ] || { echo "No pubspec.yaml, skip Flutter prep"; exit 0; }
          [ -d "android" ] || flutter create --platforms=android .

          PROP_FILE="android/gradle.properties"
          touch "$PROP_FILE"
          for K in android.builtInKotlin android.newDsl android.defaults.buildfeatures.buildconfig \
                   android.nonTransitiveRClass org.gradle.jvmargs android.enableR8.fullMode \
                   org.gradle.parallel org.gradle.caching org.gradle.configureondemand; do
            sed -i "/^$K=/d" "$PROP_FILE" 2>/dev/null || true
          done
          {
            echo "android.builtInKotlin=false"
            echo "android.newDsl=false"
            echo "android.defaults.buildfeatures.buildconfig=true"
            echo "android.nonTransitiveRClass=false"
            echo "android.enableR8.fullMode=false"
            echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.configureondemand=true"
          } >> "$PROP_FILE"

          for SF in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$SF" ] && sed -i -E "s/version[[:space:]]+['\"]9\.[0-9.]+['\"]/version \"8.7.2\"/g" "$SF" || true
          done
          for BF in android/build.gradle android/build.gradle.kts; do
            [ -f "$BF" ] && sed -i -E "s/com\.android\.tools\.build:gradle:9\.[0-9.]+/com.android.tools.build:gradle:8.7.2/g" "$BF" || true
          done

          flutter pub get || { flutter clean || true; flutter pub get; }

      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="release"
          ABI_FLAG=""
          [ "${{ github.event.inputs.abi }}" != "all" ] && ABI_FLAG="--target-platform android-arm64"

          if [ -f "pubspec.yaml" ]; then
            flutter build apk --$BUILD_TYPE $ABI_FLAG 2>&1 | tee build.log
            CODE=${PIPESTATUS[0]}
            # Retry hanya kalau penyebabnya memang tree-shake icon.
            # Error kode (syntax Dart dll) langsung gagal — tidak buang menit untuk retry sia-sia.
            if [ "$CODE" -ne 0 ] && grep -qiE "tree.?shak|IconData|font-subset" build.log; then
              echo "↻ Retry tanpa tree-shake icons"
              flutter build apk --$BUILD_TYPE $ABI_FLAG --no-tree-shake-icons
              CODE=$?
            fi
            [ "$CODE" -ne 0 ] && { echo "❌ Build gagal"; exit 1; }
          else
            G=$(find . -name "gradlew" | head -n 1)
            [ -z "$G" ] && { echo "❌ Tidak ada pubspec.yaml / gradlew"; exit 1; }
            cd "$(dirname "$G")" && chmod +x gradlew
            ./gradlew --parallel --build-cache assembleRelease || ./gradlew --parallel --build-cache assembleDebug || exit 1
          fi
          echo "✅ Build sukses"

      - name: Find APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          [ -z "$APK" ] && { echo "❌ Tidak ada file APK hasil build"; exit 1; }
          echo "APK_PATH=${APK#$GITHUB_WORKSPACE/}" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          compression-level: 0   # APK sudah terkompresi; upload & download jauh lebih cepat
          if-no-files-found: error
