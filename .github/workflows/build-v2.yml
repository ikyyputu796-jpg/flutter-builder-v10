name: Build Flutter APK V2

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      abi:
        description: "ABI: arm64 (tercepat & kecil) / all (semua ABI)"
        required: false
        default: "arm64"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_ENVIRONMENT: ci
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

    steps:
      # Tidak perlu setup-node & checkout: build hanya memakai ZIP dari bot.

      - name: Download & Extract ZIP
        run: |
          curl -fL --retry 4 --retry-all-errors --retry-delay 1 --connect-timeout 10 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -tq project.zip || { echo "❌ File bukan ZIP valid"; exit 1; }
          unzip -q project.zip -d project_raw
          rm -rf project_raw/__MACOSX
          find project_raw -maxdepth 1 -type f -name ".*" -delete
          SUB=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILES=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          # Versi Flutter: hanya dipakai kalau berupa angka persis (3.24 / 3.24.5), selain itu stable
          VER="stable"
          if [ -f "$PROJECT_DIR/pubspec.yaml" ]; then
            V=$(grep -E "^[[:space:]]+flutter:[[:space:]]*[\"']?[0-9]+\.[0-9]+(\.[0-9]+)?[\"']?[[:space:]]*$" "$PROJECT_DIR/pubspec.yaml" | head -1 | sed -E "s/.*flutter:[[:space:]]*//; s/[\"' ]//g")
            [ -n "$V" ] && VER="$V"
          fi
          echo "FLUTTER_VERSION=$VER" >> $GITHUB_ENV

      # Cache dipasang SETELAH ZIP diekstrak supaya key-nya benar-benar mengikuti project
      - name: Cache Gradle & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-build-${{ hashFiles(format('{0}/pubspec.yaml', env.PROJECT_DIR), format('{0}/android/**/*.gradle*', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Flutter
        id: flutter1
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Setup Flutter (fallback stable)
        if: ${{ steps.flutter1.outcome == 'failure' }}
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: false

      - name: Analyze Project Code
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          flutter pub get > /dev/null 2>&1
          flutter analyze > analyze_report.txt 2>&1
          CODE=$?
          echo "[RESULT_ANALYZE]"
          cat analyze_report.txt
          echo "[END_RESULT_ANALYZE]"
          exit $CODE

      - name: Auto-Fix & Prepare Android Project
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          [ -f "pubspec.yaml" ] || { echo "No pubspec.yaml, skip Flutter prep"; exit 0; }
          [ -d "android" ] || flutter create --platforms=android .

          PROP_FILE="android/gradle.properties"
          touch "$PROP_FILE"
          for K in android.builtInKotlin android.newDsl android.defaults.buildfeatures.buildconfig \
                   android.nonTransitiveRClass org.gradle.jvmargs android.enableR8.fullMode \
                   org.gradle.parallel org.gradle.caching org.gradle.configureondemand; do
            sed -i "/^$K=/d" "$PROP_FILE" 2>/dev/null || true
          done
          {
            echo "android.builtInKotlin=false"
            echo "android.newDsl=false"
            echo "android.defaults.buildfeatures.buildconfig=true"
            echo "android.nonTransitiveRClass=false"
            echo "android.enableR8.fullMode=false"
            echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.configureondemand=true"
          } >> "$PROP_FILE"

          for SF in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$SF" ] && sed -i -E "s/version[[:space:]]+['\"]9\.[0-9.]+['\"]/version \"8.7.2\"/g" "$SF" || true
          done
          for BF in android/build.gradle android/build.gradle.kts; do
            [ -f "$BF" ] && sed -i -E "s/com\.android\.tools\.build:gradle:9\.[0-9.]+/com.android.tools.build:gradle:8.7.2/g" "$BF" || true
          done

          flutter pub get || { flutter clean || true; flutter pub get; }

      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="release"
          EXTRA=""
          [ "${{ github.event.inputs.abi }}" != "all" ] && EXTRA="--target-platform android-arm64"

          if [ ! -f "pubspec.yaml" ]; then
            G=$(find . -name "gradlew" | head -n 1)
            [ -z "$G" ] && { echo "❌ Tidak ada pubspec.yaml / gradlew"; exit 1; }
            cd "$(dirname "$G")" && chmod +x gradlew
            ./gradlew --parallel --build-cache assembleRelease || ./gradlew --parallel --build-cache assembleDebug || exit 1
            exit 0
          fi

          # ── SELF-HEALING: build -> baca log -> perbaiki otomatis -> build lagi (maks 4x) ──
          for ATTEMPT in 1 2 3 4; do
            echo "=== Build percobaan $ATTEMPT ==="
            flutter build apk --$BUILD_TYPE $EXTRA 2>&1 | tee build.log
            CODE=${PIPESTATUS[0]}
            [ "$CODE" -eq 0 ] && { echo "✅ Build sukses"; exit 0; }

            FIXED=0

            # a) tree-shake icon
            if grep -qiE "tree.?shak|font-subset" build.log && [[ "$EXTRA" != *no-tree-shake-icons* ]]; then
              EXTRA="$EXTRA --no-tree-shake-icons"; FIXED=1; echo "🔧 fix: no-tree-shake-icons"
            fi

            # b) plugin lama tanpa namespace (AGP 8+)
            if grep -qi "Namespace not specified" build.log; then
              for F in $HOME/.pub-cache/hosted/*/*/android/build.gradle $HOME/.pub-cache/hosted/*/*/android/build.gradle.kts; do
                [ -f "$F" ] || continue
                grep -q "namespace" "$F" && continue
                PKG=$(grep -o 'package="[^"]*"' "$(dirname "$F")/src/main/AndroidManifest.xml" 2>/dev/null | head -1 | cut -d'"' -f2)
                [ -z "$PKG" ] && continue
                sed -i "/^android[[:space:]]*{/a\    namespace \"$PKG\"" "$F" && FIXED=1
              done
              echo "🔧 fix: namespace plugin"
            fi

            # c) minSdk terlalu rendah
            if grep -qiE "minSdk(Version)?.*(cannot be smaller|higher than)|uses-sdk:minSdkVersion" build.log; then
              for F in android/app/build.gradle android/app/build.gradle.kts; do
                [ -f "$F" ] && sed -i -E "s/(minSdk(Version)?[ =]+)(flutter\.minSdkVersion|[0-9]+)/\123/" "$F"
              done
              FIXED=1; echo "🔧 fix: minSdk 23"
            fi

            # d) versi Kotlin terlalu lama
            if grep -qiE "binary version of its metadata|Kotlin.*(incompatible|too old)" build.log; then
              for F in android/build.gradle android/settings.gradle android/settings.gradle.kts android/build.gradle.kts; do
                [ -f "$F" ] || continue
                sed -i -E "s/(kotlin_version[ =]+['\"])[0-9.]+(['\"])/\11.9.24\2/; s/(org\.jetbrains\.kotlin\.android['\"][ ]*version[ ]*['\"])[0-9.]+(['\"])/\11.9.24\2/" "$F"
              done
              FIXED=1; echo "🔧 fix: kotlin 1.9.24"
            fi

            # e) dependency conflict
            if grep -qiE "version solving failed|pub get failed" build.log && [ ! -f .pub_upgraded ]; then
              flutter pub upgrade && touch .pub_upgraded; FIXED=1; echo "🔧 fix: pub upgrade"
            fi

            # f) cache gradle rusak
            if grep -qiE "Could not (read|resolve)|Corrupt|checksum" build.log && [ ! -f .gradle_cleaned ]; then
              (cd android && ./gradlew clean >/dev/null 2>&1); touch .gradle_cleaned; FIXED=1; echo "🔧 fix: gradle clean"
            fi

            # Tidak ada yang bisa diperbaiki otomatis (mis. salah syntax Dart) -> gagal cepat
            if [ "$FIXED" -eq 0 ]; then
              echo "❌ Error di kode project, tidak bisa diperbaiki otomatis"; exit 1
            fi
          done
          echo "❌ Build masih gagal setelah 4 percobaan"; exit 1

      - name: Find APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          [ -z "$APK" ] && { echo "❌ Tidak ada file APK hasil build"; exit 1; }
          echo "APK_PATH=${APK#$GITHUB_WORKSPACE/}" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          compression-level: 0   # APK sudah terkompresi; upload & download jauh lebih cepat
          if-no-files-found: error
